<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="site_title">جمعية تدوير العطاء</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root { --green-deep: #1a3a2a; --green-mid: #2d6a4f; --green-bright: #40916c; --green-light: #74c69d; --green-pale: #b7e4c7; --cream: #f8f4ee; --sand: #e9dfc8; --dark: #111c14; --accent: #f4a261; --accent2: #e9c46a; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body { font-family: 'Cairo', sans-serif; background: var(--cream); color: var(--dark); overflow-x: hidden; }
  nav { position: fixed; top: 0; left: 0; right: 0; z-index: 100; display: flex; justify-content: space-between; align-items: center; padding: 1.2rem 4rem; background: rgba(26, 58, 42, 0.95); backdrop-filter: blur(12px); border-bottom: 1px solid rgba(116, 198, 157, 0.2); }
  .nav-logo { display: flex; align-items: center; gap: 0.8rem; color: var(--green-pale); font-family: 'Tajawal', sans-serif; font-weight: 800; font-size: 1.3rem; text-decoration: none; }
  .nav-logo .logo-icon { width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; animation: spin-slow 8s linear infinite; }
  .nav-logo .logo-icon img { width: 100%; height: 100%; object-fit: contain; }
  @keyframes spin-slow { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  .nav-links { display: flex; gap: 2rem; list-style: none; }
  .nav-links a { color: var(--green-pale); text-decoration: none; font-size: 0.95rem; font-weight: 500; transition: color 0.3s; position: relative; }
  .nav-links a:hover { color: var(--accent); }
  .hero { min-height: 100vh; background: var(--green-deep); position: relative; display: flex; align-items: center; justify-content: center; overflow: hidden; }
  .hero-content { text-align: center; z-index: 2; padding: 2rem; }
  .hero-badge { display: inline-block; background: rgba(116, 198, 157, 0.15); border: 1px solid var(--green-light); color: var(--green-light); padding: 0.4rem 1.2rem; border-radius: 100px; font-size: 0.85rem; margin-bottom: 2rem; }
  .hero h1 { font-family: 'Tajawal', sans-serif; font-size: clamp(3rem, 8vw, 6rem); font-weight: 900; color: var(--cream); line-height: 1.1; margin-bottom: 0.5rem; }
  .hero h1 span { background: linear-gradient(90deg, var(--green-light), var(--accent2)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  .hero-tagline { font-size: 1.3rem; color: var(--green-pale); margin: 1.5rem auto; max-width: 550px; font-weight: 300; line-height: 1.8; }
  .stats-bar { background: var(--green-mid); padding: 3rem 4rem; display: grid; grid-template-columns: repeat(4, 1fr); gap: 2rem; text-align: center; }
  .stat-number { font-family: 'Tajawal', sans-serif; font-size: 2.8rem; font-weight: 900; color: var(--accent2); }
  .about { padding: 7rem 4rem; max-width: 1200px; margin: 0 auto; display: grid; grid-template-columns: 1fr 1fr; gap: 5rem; align-items: center; }
  .section-title { font-family: 'Tajawal', sans-serif; font-size: 2.6rem; font-weight: 800; color: var(--green-deep); }
  .contact { background: #0f2318; padding: 7rem 4rem; text-align: center; color: white; }
  .contact-cards { display: flex; justify-content: center; gap: 1.5rem; flex-wrap: wrap; margin-top: 3rem; }
  .contact-card { background: rgba(255,255,255,0.06); padding: 1.5rem; border-radius: 16px; text-decoration: none; color: white; min-width: 200px; }
  @media (max-width: 768px) { .stats-bar { grid-template-columns: repeat(2, 1fr); } .about { grid-template-columns: 1fr; } }
</style>
</head>
<body>

<nav>
  <a href="#" class="nav-logo">
    <div class="logo-icon"><img id="logo_img" src="" alt=""></div>
    <span id="nav_site_name">تدوير العطاء</span>
  </a>
  <ul class="nav-links">
    <li><a href="#about">من نحن</a></li>
    <li><a href="#contact">تواصل معنا</a></li>
  </ul>
</nav>

<section class="hero">
  <div class="hero-content">
    <div class="hero-badge">🌿 نحو بيئة أنظف وأجمل</div>
    <h1>جمعية<br><span id="hero_title">تدوير العطاء</span></h1>
    <p class="hero-tagline" id="hero_tagline">تحميل البيانات...</p>
  </div>
</section>

<div class="stats-bar">
  <div class="stat-item"><div class="stat-number" id="stat_volunteers">0</div><div class="stat-label">متطوع</div></div>
  <div class="stat-item"><div class="stat-number" id="stat_years">0</div><div class="stat-label">سنة عطاء</div></div>
  <div class="stat-item"><div class="stat-number" id="stat_tons">0</div><div class="stat-label">طن تدوير</div></div>
  <div class="stat-item"><div class="stat-number" id="stat_partnerships">0</div><div class="stat-label">شراكة</div></div>
</div>

<section class="about" id="about">
  <div>
    <h2 class="section-title">رسالتنا في خدمة <span>المجتمع</span></h2>
    <p class="section-body" id="about_text" style="line-height: 2; margin-top: 1rem;"></p>
  </div>
  <div style="background: var(--green-deep); padding: 2rem; border-radius: 20px; color: white;">
    <h3>رؤيتنا</h3>
    <p id="vision_text"></p>
  </div>
</section>

<section class="contact" id="contact">
  <h2>تواصل معنا</h2>
  <div class="contact-cards">
    <a id="phone_link" href="#" class="contact-card"><div>📞 الهاتف</div><div id="phone_val"></div></a>
    <a id="email_link" href="#" class="contact-card"><div>✉️ البريد</div><div id="email_val"></div></a>
    <div class="contact-card"><div>📍 الموقع</div><div id="address_val"></div></div>
    <a id="twitter_link" href="#" class="contact-card"><div>🐦 تويتر</div><div>@Tadweer</div></a>
  </div>
</section>

<script>
async function loadLiveContent() {
    try {
        const response = await fetch('data.json?v=' + Math.random());
        const d = await response.json();
        
        document.getElementById('nav_site_name').innerText = d.site_name;
        document.getElementById('logo_img').src = d.logo_url;
        document.getElementById('hero_title').innerText = d.hero_title;
        document.getElementById('hero_tagline').innerText = d.hero_tagline;
        document.getElementById('about_text').innerText = d.about_text;
        document.getElementById('vision_text').innerText = d.vision_text;
        document.getElementById('stat_volunteers').innerText = d.stat_volunteers;
        document.getElementById('stat_years').innerText = d.stat_years;
        document.getElementById('stat_tons').innerText = d.stat_tons;
        document.getElementById('stat_partnerships').innerText = d.stat_partnerships;
        document.getElementById('phone_val').innerText = d.phone;
        document.getElementById('phone_link').href = "tel:" + d.phone;
        document.getElementById('email_val').innerText = d.email;
        document.getElementById('email_link').href = "mailto:" + d.email;
        document.getElementById('address_val').innerText = d.address_text;
        document.getElementById('twitter_link').href = d.twitter_url;
        document.title = d.site_name;
    } catch (e) { console.error("Error loading content"); }
}
window.onload = loadLiveContent;
</script>
</body>
</html>
