<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="page_title">جمعية تدوير العطاء</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root { --green-deep: #1a3a2a; --green-mid: #2d6a4f; --green-bright: #40916c; --green-light: #74c69d; --green-pale: #b7e4c7; --cream: #f8f4ee; --sand: #e9dfc8; --dark: #111c14; --accent: #f4a261; --accent2: #e9c46a; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Cairo', sans-serif; background: var(--cream); color: var(--dark); overflow-x: hidden; scroll-behavior: smooth; }
  nav { position: fixed; top: 0; left: 0; right: 0; z-index: 100; display: flex; justify-content: space-between; align-items: center; padding: 1.2rem 4rem; background: rgba(26, 58, 42, 0.95); backdrop-filter: blur(12px); border-bottom: 1px solid rgba(116, 198, 157, 0.2); }
  .nav-logo { display: flex; align-items: center; gap: 0.8rem; color: var(--green-pale); font-family: 'Tajawal', sans-serif; font-weight: 800; font-size: 1.3rem; text-decoration: none; }
  .nav-logo img { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; }
  .nav-links { display: flex; gap: 2rem; list-style: none; }
  .nav-links a { color: var(--green-pale); text-decoration: none; font-size: 0.95rem; }
  .hero { min-height: 100vh; background: var(--green-deep); display: flex; align-items: center; justify-content: center; text-align: center; position: relative; }
  .hero-content { z-index: 2; padding: 2rem; }
  .hero h1 { font-family: 'Tajawal', sans-serif; font-size: clamp(3rem, 8vw, 6rem); font-weight: 900; color: var(--cream); line-height: 1.1; }
  .hero h1 span { background: linear-gradient(90deg, var(--green-light), var(--accent2)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  .hero-tagline { font-size: 1.3rem; color: var(--green-pale); margin: 1.5rem auto; max-width: 600px; font-weight: 300; }
  .stats-bar { background: var(--green-mid); padding: 3rem; display: grid; grid-template-columns: repeat(4, 1fr); gap: 2rem; text-align: center; color: white; }
  .stat-number { font-size: 2.5rem; font-weight: 900; color: var(--accent2); }
  .about { padding: 5rem 4rem; display: grid; grid-template-columns: 1fr 1fr; gap: 4rem; max-width: 1200px; margin: 0 auto; }
  .contact { background: var(--dark); padding: 5rem; text-align: center; color: white; }
  .contact-cards { display: flex; justify-content: center; gap: 2rem; margin-top: 2rem; flex-wrap: wrap; }
  .contact-card { background: rgba(255,255,255,0.05); padding: 1.5rem; border-radius: 15px; text-decoration: none; color: white; min-width: 200px; }
  @media (max-width: 768px) { .nav-links { display: none; } .about { grid-template-columns: 1fr; } .stats-bar { grid-template-columns: repeat(2, 1fr); } }
</style>
</head>
<body>

<nav>
  <a href="#" class="nav-logo">
    <img id="logo_img" src="" alt="لوقو">
    <span id="site_name_nav">تدوير العطاء</span>
  </a>
  <ul class="nav-links">
    <li><a href="#about">من نحن</a></li>
    <li><a href="#contact">تواصل معنا</a></li>
  </ul>
</nav>

<section class="hero">
  <div class="hero-content">
    <h1 id="hero_title">جمعية<br><span>تدوير العطاء</span></h1>
    <p id="hero_tagline" class="hero-tagline">جاري التحميل...</p>
  </div>
</section>

<div class="stats-bar">
  <div><div id="stat_volunteers" class="stat-number">0</div><div>متطوع</div></div>
  <div><div id="stat_years" class="stat-number">0</div><div>سنة عطاء</div></div>
  <div><div id="stat_tons" class="stat-number">0</div><div>طن تدوير</div></div>
  <div><div id="stat_partnerships" class="stat-number">0</div><div>شراكة</div></div>
</div>

<section class="about" id="about">
  <div>
    <h2 style="font-size: 2.5rem; color: var(--green-deep);">رسالتنا</h2>
    <p id="about_text" style="line-height: 2; margin-top: 1rem; color: #444;"></p>
  </div>
  <div style="background: var(--green-deep); color: white; padding: 2rem; border-radius: 20px;">
    <h3>رؤيتنا</h3>
    <p id="vision_text" style="margin-top: 1rem; opacity: 0.9;"></p>
  </div>
</section>

<section class="contact" id="contact">
  <h2>تواصل معنا</h2>
  <div class="contact-cards">
    <a href="#" id="phone_link" class="contact-card">📞 <div id="phone_val"></div></a>
    <a href="#" id="email_link" class="contact-card">✉️ <div id="email_val"></div></a>
    <a href="#" id="twitter_link" class="contact-card" target="_blank">🐦 تويتر</a>
  </div>
  <p id="address_val" style="margin-top: 2rem; opacity: 0.6;"></p>
</section>

<script>
  // المحرك الميكانيكي لجلب البيانات
  async function loadData() {
    try {
      const response = await fetch('data.json?v=' + Math.random()); // منع الكاش
      const d = await response.json();

      document.getElementById('page_title').innerText = d.site_name;
      document.getElementById('site_name_nav').innerText = d.site_name;
      document.getElementById('logo_img').src = d.logo_url;
      document.getElementById('hero_title').innerHTML = d.hero_title;
      document.getElementById('hero_tagline').innerText = d.hero_tagline;
      document.getElementById('about_text').innerText = d.about_text;
      document.getElementById('vision_text').innerText = d.vision_text;
      document.getElementById('stat_volunteers').innerText = d.stat_volunteers;
      document.getElementById('stat_years').innerText = d.stat_years;
      document.getElementById('stat_tons').innerText = d.stat_tons;
      document.getElementById('stat_partnerships').innerText = d.stat_partnerships;
      document.getElementById('phone_val').innerText = d.phone;
      document.getElementById('phone_link').href = "tel:" + d.phone;
      document.getElementById('email_val').innerText = d.email;
      document.getElementById('email_link').href = "mailto:" + d.email;
      document.getElementById('address_val').innerText = d.address_text;
      document.getElementById('twitter_link').href = d.twitter_url;
    } catch (e) { console.error("خطأ في تحميل البيانات"); }
  }
  window.onload = loadData;
</script>
</body>
</html>
