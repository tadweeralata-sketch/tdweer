<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>جمعية تدوير العطاء</title>

<style>
body { font-family: Arial; margin:0; background:#f5f5f5; }
.container { padding:40px; text-align:center; }
.stats { display:flex; justify-content:center; gap:30px; flex-wrap:wrap; }
.box { background:#1f5c3b; color:white; padding:20px; border-radius:12px; width:180px; }
.contact { margin-top:40px; }
.card { background:white; padding:15px; margin:10px; border-radius:10px; }
</style>

</head>
<body>

<div class="container">

<h1>جمعية تدوير العطاء</h1>

<!-- الإحصائيات -->
<div class="stats">
  <div class="box">
    <div id="volunteers">+500</div>
    <div>متطوع نشيط</div>
  </div>

  <div class="box">
    <div id="years">20+</div>
    <div>سنة من العطاء</div>
  </div>

  <div class="box">
    <div id="recycle_amount">120</div>
    <div>طن مُعاد تدويره</div>
  </div>

  <div class="box">
    <div id="partners">+30</div>
    <div>شراكة مجتمعية</div>
  </div>
</div>

<!-- التواصل -->
<div class="contact">

  <div class="card">
    📞 <span id="phone">0500000000</span>
  </div>

  <div class="card">
    ✉️ <span id="email">info@recycling.org.sa</span>
  </div>

  <div class="card">
    📍 <span id="location">الرياض</span>
  </div>

  <div class="card">
    🐦 <span id="twitter">@TadweerAlata</span>
  </div>

</div>

</div>

<script>
fetch('settings.json?v=' + Date.now())
.then(res => res.json())
.then(data => {

document.getElementById('volunteers').innerText = data.volunteers;
document.getElementById('years').innerText = data.years;
document.getElementById('recycle_amount').innerText = data.recycle_amount;
document.getElementById('partners').innerText = data.partners;

document.getElementById('phone').innerText = data.phone;
document.getElementById('email').innerText = data.email;
document.getElementById('location').innerText = data.location;
document.getElementById('twitter').innerText = data.twitter;

});
</script>

</body>
</html>
