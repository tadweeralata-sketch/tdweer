backend:
  name: github
  repo: tadweeralata-sketch/tdweer
  branch: main
  auth_type: implicit

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "settings"
    label: "إعدادات الموقع"
    files:
      - file: "admin/data/settings.json"
        label: "بيانات الموقع"
        name: "site"
        fields:
          - { label: "رقم التواصل", name: "phone", widget: "string" }
          - { label: "البريد الإلكتروني", name: "email", widget: "string" }
          - { label: "عدد الشراكات", name: "partners", widget: "string" }
          - { label: "كمية التدوير", name: "recycle_amount", widget: "string" }
          - { label: "سنوات العطاء", name: "years", widget: "string" }
          - { label: "عدد المتطوعين", name: "volunteers", widget: "string" }
