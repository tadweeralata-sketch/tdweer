<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>لوحة التحكم الاحترافية</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
<style>
    body { font-family: 'Cairo', sans-serif; background: #f4f7f6; padding: 20px; }
    .container { max-width: 800px; margin: 0 auto; background: white; padding: 30px; border-radius: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
    h2 { color: #1a3a2a; border-bottom: 2px solid #eee; padding-bottom: 10px; }
    .form-group { margin-bottom: 15px; }
    label { display: block; font-weight: bold; margin-bottom: 5px; color: #444; }
    input, textarea { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 8px; font-family: 'Cairo'; }
    button { background: #2d6a4f; color: white; border: none; padding: 12px 25px; border-radius: 8px; cursor: pointer; font-weight: bold; width: 100%; font-size: 16px; }
    button:hover { background: #1a3a2a; }
    .status { margin-top: 15px; padding: 10px; border-radius: 8px; text-align: center; display: none; }
</style>
</head>
<body>

<div class="container">
    <h2>⚙️ إعدادات الموقع والجمعية</h2>
    
    <div class="form-group"><label>اسم الجمعية</label><input type="text" id="site_name"></div>
    <div class="form-group"><label>رابط اللوقو (صورة)</label><input type="text" id="logo_url"></div>
    <div class="form-group"><label>العنوان الرئيسي</label><input type="text" id="hero_title"></div>
    <div class="form-group"><label>الوصف</label><textarea id="hero_tagline"></textarea></div>
    
    <div class="form-group"><label>من نحن</label><textarea id="about_text"></textarea></div>
    <div class="form-group"><label>الرؤية</label><textarea id="vision_text"></textarea></div>
    
    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
        <div class="form-group"><label>المتطوعين</label><input type="text" id="stat_volunteers"></div>
        <div class="form-group"><label>السنوات</label><input type="text" id="stat_years"></div>
        <div class="form-group"><label>الأطنان</label><input type="text" id="stat_tons"></div>
        <div class="form-group"><label>الشراكات</label><input type="text" id="stat_partnerships"></div>
    </div>

    <div class="form-group"><label>رقم الهاتف</label><input type="text" id="phone"></div>
    <div class="form-group"><label>البريد</label><input type="text" id="email"></div>
    <div class="form-group"><label>الموقع (نص)</label><input type="text" id="address_text"></div>
    <div class="form-group"><label>رابط تويتر</label><input type="text" id="twitter_url"></div>

    <button onclick="updateGitHub()">🚀 حفظ التعديلات ونشرها للموقع</button>
    <div id="status" class="status"></div>
</div>

<script>
// --- إعداداتك هنا ---
const CONFIG = {
    token: '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', //
    repo: 'admein tdweer',   // 
    file: 'data.json'
};

// جلب البيانات الحالية عند الفتح
async function loadCurrent() {
    const res = await fetch('data.json?t=' + Date.now());
    const d = await res.json();
    Object.keys(d).forEach(key => {
        if(document.getElementById(key)) document.getElementById(key).value = d[key];
    });
}
loadCurrent();

async function updateGitHub() {
    const status = document.getElementById('status');
    status.style.display = 'block';
    status.style.background = '#eee';
    status.innerText = 'جاري الاتصال بـ GitHub...';

    // تجهيز البيانات الجديدة
    const newData = {};
    const ids = ['site_name','logo_url','hero_title','hero_tagline','about_text','vision_text','stat_volunteers','stat_years','stat_tons','stat_partnerships','phone','email','address_text','twitter_url'];
    ids.forEach(id => newData[id] = document.getElementById(id).value);

    try {
        // 1. جلب SHA الملف
        const getRes = await fetch(`https://api.github.com/repos/${CONFIG.repo}/contents/${CONFIG.file}`, {
            headers: { 'Authorization': `token ${CONFIG.token}` }
        });
        const fileData = await getRes.json();

        // 2. تحديث الملف
        const putRes = await fetch(`https://api.github.com/repos/${CONFIG.repo}/contents/${CONFIG.file}`, {
            method: 'PUT',
            headers: {
                'Authorization': `token ${CONFIG.token}`,
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                message: "تحديث من لوحة التحكم",
                content: btoa(unescape(encodeURIComponent(JSON.stringify(newData, null, 2)))),
                sha: fileData.sha
            })
        });

        if(putRes.ok) {
            status.style.background = '#d4edda';
            status.innerText = '✅ تم التحديث! انتظر دقيقة وحدث الموقع.';
        } else {
            throw new Error();
        }
    } catch (e) {
        status.style.background = '#f8d7da';
        status.innerText = '❌ خطأ: تأكد من التوكن واسم المستودع.';
    }
}
</script>
</body>
</html>
